<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1610;--card:#112419;--fg:#e6f4ea;--navy:#3fbf6b;--navy-fg:#08150d;--side:#07140d;--muted:#a3c4ad;--line:#234232;--red:#ff8a80;--redbg:#3a1a1a;--green:#6fd39a;--greenbg:#12301f;--amber:#ffc266;--amberbg:#3a2a10;--sh:none}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--side);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px}

nav.open{transform:none}
.logo{padding:6px 8px 14px;color:#fff}.logo .lg{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:26px;margin-bottom:8px}.logo b{display:block;font-size:17px}.logo small{opacity:.7;font-size:12px}

.navf{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
main{padding:16px;max-width:1150px;margin:auto}
h2{margin:4px 0 6px;color:var(--fg);font-size:24px}.sub{color:var(--muted);margin:0 0 16px}h3{margin:0 0 10px;font-size:16px;color:var(--fg)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid .card{margin:0}.kpi small{color:var(--muted);display:block}.kpi b{font-size:24px;color:var(--navy)}
.k2{border-radius:16px;padding:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 10%,var(--card));box-shadow:var(--sh)}

.ch{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--greenbg);font-size:16px}.k2 .ch{background:color-mix(in srgb,var(--c) 22%,var(--card))}
.g2{display:grid;gap:14px;grid-template-columns:1fr}
.qa{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;font:inherit;color:var(--fg);cursor:pointer;box-shadow:var(--sh)}.qa span{display:block;font-size:24px}
.op{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.op:last-child{border:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}.cart{min-width:0}.cart td,.cart th{white-space:normal;padding:8px 4px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--navy);color:var(--navy-fg);font-size:13px;font-weight:600}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td.r,th.r{text-align:right}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);min-width:0;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.row>*{flex:1 1 150px}
.btn{background:var(--navy);color:var(--navy-fg);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;flex:0 0 auto}
.btn.sec{background:none;color:var(--navy);border:1px solid var(--navy)}.btn.sm{padding:4px 10px}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--greenbg);color:var(--green)}.low{background:var(--amberbg);color:var(--amber)}.out{background:var(--redbg);color:var(--red)}
.alert{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.bar{height:10px;background:var(--navy);border-radius:5px}.lbl{display:flex;justify-content:space-between;font-size:13px;margin:8px 0 3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 18px;border-radius:99px;z-index:40;display:none}
.inv{background:#fff;color:#10261a;border:1px solid #dcebe0;border-radius:12px;padding:20px}.inv h3{color:#1b7a3a}.inv th{background:#1b7a3a;color:#fff}.inv td,.inv th{border-color:#dcebe0}
.tot{text-align:right;margin-top:10px}.tot div{margin:3px 0}
.out nav,.out .burger{display:none}.out main{margin:auto!important}.out .top{margin-left:0!important}
@media(min-width:900px){nav{transform:none;top:0}.top{margin-left:240px;background:var(--card);color:var(--fg);border-bottom:1px solid var(--line)}.top b{visibility:hidden}main{margin-left:240px;max-width:none;padding:24px 32px}.burger{display:none}main>*{max-width:1050px}.g2{grid-template-columns:1.3fr 1fr}}
[dir=rtl] nav{left:auto;right:0;transform:translateX(100%)}[dir=rtl] nav.open{transform:none}[dir=rtl] nav button{text-align:right}
[dir=rtl] th,[dir=rtl] td{text-align:right}[dir=rtl] td.r,[dir=rtl] th.r,[dir=rtl] .tot{text-align:left}
[dir=rtl] th:first-child{border-radius:0 10px 10px 0}[dir=rtl] th:last-child{border-radius:10px 0 0 10px}
@media(min-width:900px){[dir=rtl] nav{transform:none}[dir=rtl] .top{margin-left:0;margin-right:240px}[dir=rtl] main{margin-left:0;margin-right:240px}}
@media print{nav,.top,.noprint{display:none!important}main{margin:0}}

<div class="top"><button class="burger" onclick="document.getElementById('nav').classList.toggle('open')" aria-label="Menu">☰</button><b>PhytoStock Maroc</b><span id="co" style="font-size:13px;opacity:.85"></span></div>

<div class="toast" id="toast"></div>
<script>
const U="https://bixpdqimmczdsdmgrmkw.supabase.co",K="sb_publishable_0I2yno0scJEgD2Dym_p4SA_l7ouk8Qg";
const sb=supabase.createClient(U,K);
const PAGES=[["dash","📊","Tableau de bord"],["prod","🧪","Produits"],["stock","🗃️","Gestion de stock"],["cli","🌾","Agriculteurs"],["four","🚚","Fournisseurs"],["vente","🛒","Ventes"],["fact","🧾","Factures"],["pay","💳","Paiements"],["chq","🏦","Chèques"],["ach","📥","Achats"],["dep","💸","Dépenses"],["rap","📈","Rapports"],["arch","🗄️","Archives"],["set","⚙️","Paramètres"]];
let S={view:"dash",user:null,p:[],c:[],f:[],inv:[],ln:[],set:{nom:"Ma boîte phytosanitaire",tva:0,ville:"",ice:"",agrement:""},cart:[],q:"",cat:"",open:null};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dh=n=>(Math.round(n*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2})+" DH";
const $=id=>document.getElementById(id);
const toast=m=>{const t=$("toast");t.textContent=S.lang==="ar"?trs(m):m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3000)};
const run=async p=>{const{data,error}=await p;if(error){toast(error.message);throw error}return data};
const TODAY=new Date().toISOString().slice(0,10);
const dd=p=>p.expiration?Math.round((new Date(p.expiration)-new Date(TODAY))/864e5):9999;
const st=p=>dd(p)<0?'<span class="badge out">Périmé ('+(-dd(p))+' j)</span>':p.stock<=0?'<span class="badge out">Rupture</span>':p.stock<=p.seuil?'<span class="badge low">Stock faible</span>':dd(p)<=90?'<span class="badge low">Expire dans '+dd(p)+' j</span>':'<span class="badge ok">En stock</span>';
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join("");
const cats=()=>[...new Set(S.p.map(p=>p.categorie).filter(Boolean))];
const invLines=i=>S.ln.filter(l=>l.invoice_id===i.id);
const invHT=i=>invLines(i).reduce((a,l)=>a+l.quantite*l.prix_unitaire,0);
const invTTC=i=>invHT(i)*(1-(i.remise||0)/100)*(1+i.tva_rate/100);
const paid=i=>S.pay.filter(p=>p.invoice_id===i.id).reduce((a,p)=>a+p.montant,0);
const reste=i=>invTTC(i)-paid(i);
const CUR=TODAY.slice(0,7);S.month=CUR;S.vf={d:TODAY,r:0,p:"",m:"Espèces",c:"Client de passage",cn:"",ec:""};S.pay=[];S.pur=[];S.exp=[];S.sp=[];S.rp={d1:CUR+"-01",d2:TODAY};try{S.lang=localStorage.getItem("pm_lang")||"fr"}catch(e){S.lang="fr"}
const mInv=()=>S.inv.filter(i=>i.date.slice(0,7)===S.month);
const mLn=()=>{const ids=new Set(mInv().map(i=>i.id));return S.ln.filter(l=>ids.has(l.invoice_id))};
const mlabel=m=>new Date(m+"-01").toLocaleDateString(S.lang==="ar"?"ar-MA-u-nu-latn":"fr-FR",{month:"long",year:"numeric"});
const banner=()=>S.month!==CUR?`<div class="alert" style="background:var(--amberbg);color:var(--amber)">🗄️ Archive : <b>${mlabel(S.month)}</b> <button class="btn sm" onclick="S.month=CUR;render()">Revenir au mois en cours</button></div>`:"";
async function load(){const T=t=>run(sb.from(t).select("*"));const[p,c,f,i,l,s,py,pu,ex,sp]=await Promise.all([run(sb.from("products").select("*").order("nom")),run(sb.from("customers").select("*").order("nom")),run(sb.from("suppliers").select("*").order("nom")),run(sb.from("invoices").select("*").order("id",{ascending:false})),T("invoice_lines"),run(sb.from("shop_settings").select("*").maybeSingle()),T("payments"),run(sb.from("purchases").select("*").order("id",{ascending:false})),run(sb.from("expenses").select("*").order("date",{ascending:false})),T("supplier_payments")]);S.p=p;S.c=c;S.f=f;S.inv=i;S.ln=l;S.pay=py;S.pur=pu;S.exp=ex;S.sp=sp;if(s)S.set=s}
async function boot(){document.body.classList.toggle("out",!S.user);if(S.user){try{await load()}catch(e){}}render()}
sb.auth.onAuthStateChange((ev,ses)=>{const u=ses?ses.user:null;if((u&&u.id)!==(S.user&&S.user.id)){S.user=u;setTimeout(boot,0)}});
async function auth(mode){const email=$("em").value.trim(),password=$("pw").value;if(!email||password.length<6){toast("Email et mot de passe (6 caractères min.) requis");return}
const r=mode==="up"?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
if(r.error){toast(r.error.message);return}if(mode==="up"&&!r.data.session)toast("Compte créé. Vérifiez votre email pour confirmer.")}
const logout=()=>sb.auth.signOut();
const go=v=>{S.month=CUR;S.view=v;S.open=null;$("nav").classList.remove("open");render();scrollTo(0,0)};
function prodRows(){const q=S.q.toLowerCase();return S.p.filter(p=>(!S.cat||p.categorie===S.cat)&&p.nom.toLowerCase().includes(q)).map(p=>`<tr><td>${ico(p.categorie)} ${esc(p.nom)}</td><td>${esc(p.matiere_active||"—")}</td><td>${esc(p.categorie||"")}</td><td class="r">${dh(p.prix_vente)}</td><td class="r">${p.stock} ${esc(p.unite||"")}</td><td>${p.expiration||"—"}</td><td>${st(p)}</td><td><button class="btn sm sec" onclick="delP(${p.id})">Supprimer</button></td></tr>`).join("")||'<tr><td colspan="8">Aucun produit.</td></tr>'}
function search(){S.q=$("q").value;S.cat=$("cf").value;$("pb").innerHTML=prodRows();if(S.lang==="ar")applyAr($("pb"))}
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
async function addP(e){const f=fd(e),fo=S.f.find(x=>x.nom===f.four);await run(sb.from("products").insert({nom:f.nom,categorie:f.cat,matiere_active:f.ma||null,prix_achat:+f.achat,prix_vente:+f.prix,stock:+f.stock,unite:f.u,seuil:+f.seuil,fournisseur_id:fo?fo.id:null,expiration:f.exp||null}));toast("Produit ajouté ✓");await load();render()}
async function delP(id){if(confirm("Supprimer ce produit ?")){await run(sb.from("products").delete().eq("id",id));await load();render()}}
async function adj(id,d){const p=S.p.find(x=>x.id===id);await run(sb.from("products").update({stock:Math.max(0,p.stock+d)}).eq("id",id));await load();render()}
const addPerson=t=>async e=>{const f=fd(e),o={nom:f.nom,tel:f.tel,ville:f.ville};if(t==="customers")o.culture=f.x||null;await run(sb.from(t).insert(o));toast("Ajouté ✓");await load();render()};
const addC=addPerson("customers"),addF=addPerson("suppliers");
function addCart(){const p=S.p.find(x=>x.id===+$("sp").value),q=+$("sq").value,px=+$("spx").value;if(!p||q<1||$("spx").value===""||!(px>=0)){toast("Prix invalide");return}if(p.expiration&&dd(p)<0){toast("Produit périmé : vente bloquée");return}const used=S.cart.filter(x=>x.id===p.id).reduce((a,x)=>a+x.q,0);if(used+q>p.stock){toast("Stock insuffisant ("+p.stock+" dispo.)");return}const ex=S.cart.find(x=>x.id===p.id&&x.pu===px);if(ex)ex.q+=q;else S.cart.push({id:p.id,n:p.nom,q,pu:px});render()}
const rmCart=i=>{S.cart.splice(i,1);render()};
const setPu=(i,v)=>{S.cart[i].pu=Math.max(0,+v||0);render()};
async function validate(){if(!S.cart.length){toast("Panier vide");return}const f=S.vf;const no=await run(sb.rpc("create_sale",{p_client:f.c,p_lines:S.cart.map(l=>({produit_id:l.id,quantite:l.q,prix:l.pu})),p_date:f.d,p_remise:f.r||0,p_paye:+f.p||0,p_mode:f.m,p_cheque_no:f.cn||null,p_echeance:f.ec||null}));S.cart=[];S.vf={d:TODAY,r:0,p:"",m:"Espèces",c:"Client de passage",cn:"",ec:""};await load();const i=S.inv.find(x=>x.numero===no);S.month=f.d.slice(0,7);S.view="fact";S.open=i?i.id:null;toast("Vente enregistrée : "+no);render()}
async function addPay(e){const f=fd(e);await run(sb.rpc("add_payment",{p_invoice:+f.inv,p_montant:+f.montant,p_mode:f.mode,p_date:f.date,p_note:f.note||null,p_cheque_no:f.cno||null,p_echeance:f.ech||null}));toast("Paiement enregistré ✓");await load();render()}
async function addAch(e){const f=fd(e);if(+f.paye>0&&!f.four){toast("Choisissez un fournisseur pour enregistrer le paiement");return}await run(sb.rpc("create_purchase",{p_produit:+f.prod,p_qte:+f.qte,p_prix:+f.prix,p_fournisseur:f.four||null,p_date:f.date,p_paye:+f.paye||0,p_mode:f.mode,p_cheque_no:f.cno||null,p_echeance:f.ech||null}));toast("Achat enregistré, stock mis à jour ✓");await load();render()}
async function addDep(e){const f=fd(e);await run(sb.from("expenses").insert({date:f.date,libelle:f.libelle,categorie:f.cat,montant:+f.montant}));toast("Dépense enregistrée ✓");await load();render()}
async function addSP(e){const f=fd(e);await run(sb.from("supplier_payments").insert({fournisseur:f.four,montant:+f.montant,mode:f.mode,date:f.date,cheque_no:f.cno||null,echeance:f.ech||null,cheque_statut:f.mode==="Chèque"?"en_attente":null,note:f.note||null}));toast("Paiement enregistré ✓");await load();render()}
async function chqDone(t,id){await run(sb.from(t).update({cheque_statut:"encaisse"}).eq("id",id));toast("Chèque mis à jour ✓");await load();render()}
async function delDep(id){if(confirm("Supprimer cette dépense ?")){await run(sb.from("expenses").delete().eq("id",id));await load();render()}}
async function setS(e){const f=fd(e);await run(sb.from("shop_settings").upsert({owner:S.user.id,nom:f.nom,ville:f.ville,ice:f.ice,agrement:f.ag,tva:+f.tva}));toast("Paramètres enregistrés ✓");await load();render()}
function people(t,k,fn,btn){const c=k==="c";return`<h2>${t}</h2><div class="card"><h3>${btn}</h3><form onsubmit="${fn}(event)"><div class="row"><input name="nom" placeholder="Nom / Exploitation" required><input name="tel" placeholder="Téléphone"><input name="ville" placeholder="Ville / Douar">${c?'<input name="x" placeholder="Culture et superficie">':""}<button class="btn">Ajouter</button></div></form></div><div class="card"><div class="tw"><table><tr><th>Nom</th><th>Téléphone</th><th>Ville</th>${c?"<th>Culture</th>":""}</tr>${S[k].map(x=>`<tr><td>${esc(x.nom)}</td><td>${esc(x.tel)}</td><td>${esc(x.ville)}</td>${c?`<td>${esc(x.culture)}</td>`:""}</tr>`).join("")}</table></div></div>`}
const mths=n=>{const a=[],d=new Date(CUR+"-01");for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"))}return a};
const mShort=m=>new Date(m+"-01").toLocaleDateString(S.lang==="ar"?"ar-MA-u-nu-latn":"fr-FR",{month:"short"});
const MODES=["Espèces","Virement","Chèque"];
const cost=l=>{const p=S.p.find(x=>x.id===l.produit_id);return p?p.prix_achat:l.prix_unitaire};
const mSeries=()=>mths(6).map(m=>{let ca=0,mg=0;S.inv.filter(i=>i.date.slice(0,7)===m).forEach(i=>invLines(i).forEach(l=>{const k=1-(i.remise||0)/100;ca+=l.quantite*l.prix_unitaire*k*(1+i.tva_rate/100);mg+=l.quantite*(l.prix_unitaire*k-cost(l))}));return{m,ca,mg}});
const spark=(a,c)=>{const mx=Math.max(...a,1),w=120,h=36,pts=a.map((v,i)=>[i*w/(a.length-1),h-3-(v/mx)*(h-8)]);return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="36" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/></svg>`};

fact(){if(S.open){const i=S.inv.find(x=>x.id===S.open);if(i){const ht0=invHT(i),rem=ht0*(i.remise||0)/100,ht=ht0-rem,tva=ht*i.tva_rate/100;return`<div class="noprint row"><button class="btn sec" onclick="S.open=null;render()">← Retour</button><button class="btn" onclick="window.print()">🖨️ Imprimer</button></div><div class="inv"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h3 style="font-size:22px">${esc(S.set.nom)}</h3>${esc(S.set.ville)}<br>ICE : ${esc(S.set.ice)}<br>${esc(S.set.agrement)}</div><div style="text-align:right"><h3>FACTURE ${esc(i.numero)}</h3>Date : ${i.date.split("-").reverse().join("/")}</div></div><p><b>Agriculteur :</b> ${esc(i.client_nom)}</p><div class="tw"><table><tr><th>Désignation</th><th class="r">Qté</th><th class="r">P.U.</th><th class="r">Total HT</th></tr>${invLines(i).map(l=>`<tr><td>${esc(l.designation)}</td><td class="r">${l.quantite}</td><td class="r">${dh(l.prix_unitaire)}</td><td class="r">${dh(l.quantite*l.prix_unitaire)}</td></tr>`).join("")}</table></div><div class="tot"><div>Total HT : ${dh(ht0)}</div>${rem?`<div>Remise (${i.remise} %) : − ${dh(rem)}</div>`:""}<div>TVA (${i.tva_rate} %) : ${dh(tva)}</div><div style="font-size:19px"><b>Net à payer : ${dh(ht+tva)}</b></div><div>Payé : ${dh(paid(i))}</div><div><b>Reste : ${dh(reste(i))}</b></div></div></div>`}}
return`<h2>Factures — ${mlabel(S.month)}</h2>${banner()}<div class="card"><div class="tw"><table><tr><th>N°</th><th>Date</th><th>Client</th><th class="r">Total TTC</th><th>Statut</th><th></th></tr>${mInv().map(i=>`<tr><td>${esc(i.numero)}</td><td>${i.date}</td><td>${esc(i.client_nom)}</td><td class="r">${dh(invTTC(i))}</td><td>${reste(i)>0.005?`<span class="badge low">Reste ${dh(reste(i))}</span>`:'<span class="badge ok">Payée</span>'}</td><td><button class="btn sm" onclick="S.open=${i.id};render()">Voir</button></td></tr>`).join("")||'<tr><td colspan="5">Aucune facture.</td></tr>'}</table></div></div>`},
arch(){const ms=[...new Set(S.inv.map(i=>i.date.slice(0,7)))].sort().reverse();return`<h2>Archives</h2><div class="card"><p style="color:var(--muted)">Chaque mois, le tableau de bord, les factures et les rapports repartent à zéro. Les mois passés restent ici, consultables à tout moment. Le stock, lui, continue.</p><div class="tw"><table><tr><th>Mois</th><th class="r">Factures</th><th class="r">Total TTC</th><th></th></tr>${ms.map(m=>{const l=S.inv.filter(i=>i.date.slice(0,7)===m);return`<tr><td>${mlabel(m)}${m===CUR?" (en cours)":""}</td><td class="r">${l.length}</td><td class="r">${dh(l.reduce((a,i)=>a+invTTC(i),0))}</td><td><button class="btn sm" onclick="S.month='${m}';S.view='fact';S.open=null;render()">Ouvrir</button></td></tr>`}).join("")||'<tr><td colspan="4">Aucune archive.</td></tr>'}</table></div></div>`},
rap(){const q=S.rp,invs=S.inv.filter(i=>i.date>=q.d1&&i.date<=q.d2),ids=new Set(invs.map(i=>i.id)),ct={};let ca=0,mg=0;invs.forEach(i=>{const k=1-(i.remise||0)/100,t=1+i.tva_rate/100;invLines(i).forEach(l=>{const v=l.quantite*l.prix_unitaire*k;ca+=v*t;mg+=v-l.quantite*cost(l);const c=l.categorie||"Autre";ct[c]=(ct[c]||0)+v*t})});
const enc=S.pay.filter(p=>ids.has(p.invoice_id)).reduce((a,p)=>a+p.montant,0),dep=S.exp.filter(e=>e.date>=q.d1&&e.date<=q.d2).reduce((a,e)=>a+e.montant,0),rs=invs.reduce((a,i)=>a+Math.max(0,reste(i)),0),[tc,tp]=tops(invs);
const kp=(l,v,c)=>`<div class="card kpi"><small>${l}</small><b${c?` style="color:${c}"`:""}>${dh(v)}</b></div>`;
return`<h2>Rapports</h2><div class="card"><div class="row"><label style="font-size:12px;color:var(--muted)">Du<input type="date" value="${q.d1}" onchange="setRp(this.value,S.rp.d2)"></label><label style="font-size:12px;color:var(--muted)">Au<input type="date" value="${q.d2}" onchange="setRp(S.rp.d1,this.value)"></label></div><div class="row"><button class="btn sm sec" onclick="presetRp('m')">Ce mois</button><button class="btn sm sec" onclick="presetRp('p')">Mois dernier</button><button class="btn sm sec" onclick="presetRp('y')">Cette année</button><button class="btn sm" onclick="csvRp()">⬇️ Exporter (Excel)</button></div></div>
<div class="grid">${kp("Chiffre d’affaires",ca)}${kp("Marge estimée",mg)}${kp("Dépenses",dep)}${kp("Résultat (marge − dépenses)",mg-dep,mg-dep<0?"var(--red)":"")}${kp("Encaissé",enc)}${kp("Reste à encaisser",rs,"var(--amber)")}</div>
<div class="g2"><div class="card"><h3>Top 5 agriculteurs</h3>${bars(tc)}</div><div class="card"><h3>Top 5 produits</h3>${bars(tp)}</div></div><div class="card"><h3>Ventes par catégorie</h3>${bars(ct)}</div><p style="color:var(--muted);font-size:13px">${invs.length} facture(s) sur la période. La marge est estimée avec le dernier prix d’achat de chaque produit.</p>`},
set(){return`<h2>Paramètres</h2><div class="card"><h3>Informations de l’entreprise</h3><form onsubmit="setS(event)"><div class="row"><input name="nom" value="${esc(S.set.nom)}" placeholder="Raison sociale" required><input name="ville" value="${esc(S.set.ville)}" placeholder="Ville"><input name="ice" value="${esc(S.set.ice)}" placeholder="ICE"><input name="ag" value="${esc(S.set.agrement)}" placeholder="N° agrément ONSSA"><input name="tva" type="number" min="0" max="100" step="0.01" value="${S.set.tva}" placeholder="TVA %"></div><button class="btn">Enregistrer</button></form></div><div class="card"><h3>Compte</h3><p style="color:var(--muted)">${esc(S.user.email)}</p><button class="btn sec" onclick="logout()">Se déconnecter</button></div>`}};
function loginView(){return`<div class="card" style="max-width:380px;margin:40px auto"><h2 style="text-align:center">🌾 PhytoStock Maroc</h2><p style="text-align:center;color:var(--muted)">Connectez-vous ou créez votre compte</p><div class="row"><input id="em" type="email" placeholder="Email" autocomplete="email"></div><div class="row"><input id="pw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password"></div><div class="row"><button class="btn" onclick="auth('in')">Connexion</button><button class="btn sec" onclick="auth('up')">Créer un compte</button></div><div style="text-align:center"><button class="btn sm sec" onclick="setLang('${S.lang==='ar'?'fr':'ar'}')">🌐 ${S.lang==='ar'?'Français':'العربية'}</button></div></div>`}
function render(){document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.documentElement.lang=S.lang;$("nav").innerHTML='<div class="logo"><div class="lg">🌾</div><b>PhytoStock</b><small>Gestion de votre boîte phytosanitaire</small></div>'+PAGES.map(([id,ic,l])=>`<button class="${S.view===id?"on":""}" onclick="go('${id}')"><span>${ic}</span>${l}</button>`).join("")+`<div class="navf"><button onclick="setLang('${S.lang==="ar"?"fr":"ar"}')"><span>🌐</span>${S.lang==="ar"?"Français":"العربية"}</button><button onclick="logout()"><span>🚪</span>Déconnexion</button></div>`;$("co").textContent=S.user?S.set.nom:"";$("main").innerHTML=S.user?V[S.view]():loginView();if(S.user&&S.view==="vente"&&$("sp"))fillPx();if(S.lang==="ar"){applyAr($("nav"));applyAr($("main"))}}
render();
</script>
</body>
</html>
