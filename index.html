<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhytoStock Maroc</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3d24">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="PhytoStock">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f7f4;--card:#fff;--fg:#10261a;--navy:#1b7a3a;--navy-fg:#fff;--side:#0f3d24;--muted:#5c7566;--line:#e4ece6;--red:#c62828;--redbg:#fdeaea;--green:#1b7a46;--greenbg:#e6f5ec;--amber:#a15c00;--amberbg:#fff3df;--sh:0 2px 10px rgba(16,38,26,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1610;--card:#112419;--fg:#e6f4ea;--navy:#3fbf6b;--navy-fg:#08150d;--side:#07140d;--muted:#a3c4ad;--line:#234232;--red:#ff8a80;--redbg:#3a1a1a;--green:#6fd39a;--greenbg:#12301f;--amber:#ffc266;--amberbg:#3a2a10;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1610;--card:#112419;--fg:#e6f4ea;--navy:#3fbf6b;--navy-fg:#08150d;--side:#07140d;--muted:#a3c4ad;--line:#234232;--red:#ff8a80;--redbg:#3a1a1a;--green:#6fd39a;--greenbg:#12301f;--amber:#ffc266;--amberbg:#3a2a10;--sh:none}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--side);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px}
.top b{font-size:18px;flex:1}.burger{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;font-size:20px;padding:2px 10px;cursor:pointer}
nav{position:fixed;left:0;top:calc(52px + env(safe-area-inset-top,0px));bottom:0;width:240px;background:var(--side);padding:12px 10px;overflow-y:auto;transform:translateX(-100%);transition:.2s;z-index:15;display:flex;flex-direction:column}
nav.open{transform:none}
.logo{padding:6px 8px 14px;color:#fff}.logo .lg{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:26px;margin-bottom:8px}.logo b{display:block;font-size:17px}.logo small{opacity:.7;font-size:12px}
nav button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;color:rgba(255,255,255,.82);padding:11px 12px;border-radius:12px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.navf{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
main{padding:16px;max-width:1150px;margin:auto}
h2{margin:4px 0 6px;color:var(--fg);font-size:24px}.sub{color:var(--muted);margin:0 0 16px}h3{margin:0 0 10px;font-size:16px;color:var(--fg)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid .card{margin:0}.kpi small{color:var(--muted);display:block}.kpi b{font-size:24px;color:var(--navy)}
.k2{border-radius:16px;padding:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 10%,var(--card));box-shadow:var(--sh)}
.k2 small{color:var(--muted);display:flex;justify-content:space-between;align-items:center}.k2 b{display:block;font-size:22px;margin:4px 0}
.ch{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--greenbg);font-size:16px}.k2 .ch{background:color-mix(in srgb,var(--c) 22%,var(--card))}
.g2{display:grid;gap:14px;grid-template-columns:1fr}
.qa{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;font:inherit;color:var(--fg);cursor:pointer;box-shadow:var(--sh)}.qa span{display:block;font-size:24px}
.op{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.op:last-child{border:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}.cart{min-width:0}.cart td,.cart th{white-space:normal;padding:8px 4px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--navy);color:var(--navy-fg);font-size:13px;font-weight:600}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td.r,th.r{text-align:right}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);min-width:0;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.row>*{flex:1 1 150px}
.btn{background:var(--navy);color:var(--navy-fg);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;flex:0 0 auto}
.btn.sec{background:none;color:var(--navy);border:1px solid var(--navy)}.btn.sm{padding:4px 10px}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--greenbg);color:var(--green)}.low{background:var(--amberbg);color:var(--amber)}.out{background:var(--redbg);color:var(--red)}
.alert{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.bar{height:10px;background:var(--navy);border-radius:5px}.lbl{display:flex;justify-content:space-between;font-size:13px;margin:8px 0 3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 18px;border-radius:99px;z-index:40;display:none}
.inv{background:#fff;color:#10261a;border:1px solid #dcebe0;border-radius:12px;padding:20px}.inv h3{color:#1b7a3a}.inv th{background:#1b7a3a;color:#fff}.inv td,.inv th{border-color:#dcebe0}
.tot{text-align:right;margin-top:10px}.tot div{margin:3px 0}

const spark=(a,c)=>{const mx=Math.max(...a,1),w=120,h=36,pts=a.map((v,i)=>[i*w/(a.length-1),h-3-(v/mx)*(h-8)]);return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="36" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/></svg>`};

<div class="card"><h3>Historique des paiements</h3><div class="tw"><table><tr><th>Date</th><th>Fournisseur</th><th>Mode</th><th class="r">Montant</th></tr>${S.sp.slice().sort((a,b)=>b.id-a.id).slice(0,15).map(p=>`<tr><td>${p.date}</td><td>${esc(p.fournisseur)}</td><td>${esc(p.mode)}</td><td class="r">${dh(p.montant)}</td></tr>`).join("")||'<tr><td colspan="4">Aucun paiement.</td></tr>'}</table></div></div>`},
ach(){return`<h2>Achats (réapprovisionnement)</h2><div class="card"><h3>Nouvel achat</h3><form onsubmit="addAch(event)"><div class="row"><select name="prod" required>${S.p.map(p=>`<option value="${p.id}">${esc(p.nom)} (stock : ${p.stock})</option>`).join("")}</select><select name="four"><option value="">Fournisseur</option>${opts(S.f.map(f=>f.nom))}</select></div><div class="row"><input name="qte" type="number" min="1" placeholder="Quantité" required><input name="prix" type="number" step="0.01" min="0" placeholder="Prix d’achat unitaire (DH)" required><input name="date" type="date" value="${TODAY}" required></div><div class="row"><input name="paye" type="number" step="0.01" min="0" placeholder="Montant payé (DH), vide = crédit"><select name="mode">${MODES.map(m=>`<option>${m}</option>`).join("")}</select><input name="cno" placeholder="N° du chèque (si chèque)"><label style="flex:1 1 150px;font-size:12px;color:var(--muted)">Échéance du chèque<input name="ech" type="date"></label></div><div class="row"><button class="btn">Enregistrer</button></div></form></div><div class="card"><div class="tw"><table><tr><th>Date</th><th>Produit</th><th class="r">Qté</th><th class="r">Prix d’achat</th><th>Fournisseur</th></tr>${S.pur.map(p=>`<tr><td>${p.date}</td><td>${esc(p.designation)}</td><td class="r">${p.quantite}</td><td class="r">${dh(p.prix_achat)}</td><td>${esc(p.fournisseur||"—")}</td></tr>`).join("")||'<tr><td colspan="5">Aucun achat.</td></tr>'}</table></div></div>`},
dep(){const tm=S.exp.filter(e=>e.date.slice(0,7)===CUR).reduce((a,e)=>a+e.montant,0);return`<h2>Dépenses</h2><div class="grid"><div class="card kpi"><small>Dépenses de ${mlabel(CUR)}</small><b>${dh(tm)}</b></div></div><div class="card"><h3>Nouvelle dépense</h3><form onsubmit="addDep(event)"><div class="row"><input name="libelle" placeholder="Libellé (ex. Loyer)" required><select name="cat">${opts(["Loyer","Transport","Salaires","Électricité / Eau","Autre"])}</select><input name="montant" type="number" step="0.01" min="0" placeholder="Montant (DH)" required><input name="date" type="date" value="${TODAY}" required><button class="btn">Ajouter</button></div></form></div><div class="card"><div class="tw"><table><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th class="r">Montant</th><th></th></tr>${S.exp.map(e=>`<tr><td>${e.date}</td><td>${esc(e.libelle)}</td><td>${esc(e.categorie||"")}</td><td class="r">${dh(e.montant)}</td><td><button class="btn sm sec" onclick="delDep(${e.id})">✕</button></td></tr>`).join("")||'<tr><td colspan="5">Aucune dépense.</td></tr>'}</table></div></div>`},
fact(){if(S.open){const i=S.inv.find(x=>x.id===S.open);if(i){const ht0=invHT(i)-retHT(i),rem=ht0*(i.remise||0)/100,ht=ht0-rem,tva=ht*i.tva_rate/100;return`<div class="noprint row"><button class="btn sec" onclick="S.open=null;render()">← Retour</button><button class="btn" onclick="window.print()">🖨️ Imprimer</button></div><div class="inv"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h3 style="font-size:22px">${esc(S.set.nom)}</h3>${esc(S.set.ville)}<br>ICE : ${esc(S.set.ice)}<br>${esc(S.set.agrement)}</div><div style="text-align:right"><h3>FACTURE ${esc(i.numero)}</h3>Date : ${i.date.split("-").reverse().join("/")}</div></div><p><b>Agriculteur :</b> ${esc(i.client_nom)}</p><div class="tw"><table><tr><th>Désignation</th><th class="r">Qté</th><th class="r">P.U.</th><th class="r">Total HT</th></tr>${invLines(i).map(l=>`<tr><td>${esc(l.designation)}</td><td class="r">${l.quantite-retQ(l)}${retQ(l)?` <small style="color:var(--red)">(−${retQ(l)} retourné)</small>`:""}</td><td class="r">${dh(l.prix_unitaire)}</td><td class="r">${dh((l.quantite-retQ(l))*l.prix_unitaire)}</td></tr>`).join("")}</table></div><div class="tot"><div>Total HT : ${dh(ht0)}</div>${rem?`<div>Remise (${i.remise} %) : − ${dh(rem)}</div>`:""}<div>TVA (${i.tva_rate} %) : ${dh(tva)}</div><div style="font-size:19px"><b>Net à payer : ${dh(ht+tva)}</b></div><div>Payé : ${dh(paid(i))}</div>${refundOf(i)?`<div>Remboursé au client : − ${dh(refundOf(i))}</div>`:""}${reste(i)<-0.005?`<div><b>À rembourser au client : ${dh(-reste(i))}</b></div>`:`<div><b>Reste : ${dh(reste(i))}</b></div>`}</div></div>${retBlock(i)}`}}
return`<h2>Factures — ${mlabel(S.month)}</h2>${banner()}<div class="card"><div class="tw"><table><tr><th>N°</th><th>Date</th><th>Client</th><th class="r">Total TTC</th><th>Statut</th><th></th></tr>${mInv().map(i=>`<tr><td>${esc(i.numero)}</td><td>${i.date}</td><td>${esc(i.client_nom)}</td><td class="r">${dh(invNet(i))}</td><td>${reste(i)>0.005?`<span class="badge low">Reste ${dh(reste(i))}</span>`:reste(i)<-0.005?'<span class="badge out">À rembourser</span>':'<span class="badge ok">Payée</span>'}</td><td><button class="btn sm" onclick="S.open=${i.id};render()">Voir</button></td></tr>`).join("")||'<tr><td colspan="5">Aucune facture.</td></tr>'}</table></div></div>`},
arch(){const ms=[...new Set(S.inv.map(i=>i.date.slice(0,7)))].sort().reverse();return`<h2>Archives</h2><div class="card"><p style="color:var(--muted)">Chaque mois, le tableau de bord, les factures et les rapports repartent à zéro. Les mois passés restent ici, consultables à tout moment. Le stock, lui, continue.</p><div class="tw"><table><tr><th>Mois</th><th class="r">Factures</th><th class="r">Total TTC</th><th></th></tr>${ms.map(m=>{const l=S.inv.filter(i=>i.date.slice(0,7)===m);return`<tr><td>${mlabel(m)}${m===CUR?" (en cours)":""}</td><td class="r">${l.length}</td><td class="r">${dh(l.reduce((a,i)=>a+invNet(i),0))}</td><td><button class="btn sm" onclick="S.month='${m}';S.view='fact';S.open=null;render()">Ouvrir</button></td></tr>`}).join("")||'<tr><td colspan="4">Aucune archive.</td></tr>'}</table></div></div>`},
rap(){const q=S.rp,invs=S.inv.filter(i=>i.date>=q.d1&&i.date<=q.d2),ids=new Set(invs.map(i=>i.id)),ct={};let ca=0,mg=0;invs.forEach(i=>{const k=1-(i.remise||0)/100,t=1+i.tva_rate/100;invLines(i).forEach(l=>{const v=l.quantite*l.prix_unitaire*k;ca+=v*t;mg+=v-l.quantite*cost(l);const c=l.categorie||"Autre";ct[c]=(ct[c]||0)+v*t})});
S.cn.filter(c=>c.date>=q.d1&&c.date<=q.d2).forEach(c=>{const i=S.inv.find(x=>x.id===c.invoice_id)||{remise:0,tva_rate:0},k=1-(i.remise||0)/100;cnLines(c).forEach(l=>{const v=l.quantite*l.prix_unitaire*k,g=l.categorie||"Autre";ca-=v*(1+(i.tva_rate||0)/100);mg-=v-l.quantite*cost(l);ct[g]=Math.max(0,(ct[g]||0)-v*(1+(i.tva_rate||0)/100))})});
const enc=S.pay.filter(p=>ids.has(p.invoice_id)).reduce((a,p)=>a+p.montant,0),dep=S.exp.filter(e=>e.date>=q.d1&&e.date<=q.d2).reduce((a,e)=>a+e.montant,0),rs=invs.reduce((a,i)=>a+Math.max(0,reste(i)),0),[tc,tp]=tops(invs);
const kp=(l,v,c)=>`<div class="card kpi"><small>${l}</small><b${c?` style="color:${c}"`:""}>${dh(v)}</b></div>`;
return`<h2>Rapports</h2><div class="card"><div class="row"><label style="font-size:12px;color:var(--muted)">Du<input type="date" value="${q.d1}" onchange="setRp(this.value,S.rp.d2)"></label><label style="font-size:12px;color:var(--muted)">Au<input type="date" value="${q.d2}" onchange="setRp(S.rp.d1,this.value)"></label></div><div class="row"><button class="btn sm sec" onclick="presetRp('m')">Ce mois</button><button class="btn sm sec" onclick="presetRp('p')">Mois dernier</button><button class="btn sm sec" onclick="presetRp('y')">Cette année</button><button class="btn sm" onclick="csvRp()">⬇️ Exporter (Excel)</button></div></div>
<div class="grid">${kp("Chiffre d’affaires",ca)}${kp("Marge estimée",mg)}${kp("Dépenses",dep)}${kp("Résultat (marge − dépenses)",mg-dep,mg-dep<0?"var(--red)":"")}${kp("Encaissé",enc)}${kp("Reste à encaisser",rs,"var(--amber)")}</div>
<div class="g2"><div class="card"><h3>Top 5 agriculteurs</h3>${bars(tc)}</div><div class="card"><h3>Top 5 produits</h3>${bars(tp)}</div></div><div class="card"><h3>Ventes par catégorie</h3>${bars(ct)}</div><p style="color:var(--muted);font-size:13px">${invs.length} facture(s) sur la période. La marge est estimée avec le dernier prix d’achat de chaque produit.</p>`},
set(){return`<h2>Paramètres</h2><div class="card"><h3>Informations de l’entreprise</h3><form onsubmit="setS(event)"><div class="row"><input name="nom" value="${esc(S.set.nom)}" placeholder="Raison sociale" required><input name="ville" value="${esc(S.set.ville)}" placeholder="Ville"><input name="ice" value="${esc(S.set.ice)}" placeholder="ICE"><input name="ag" value="${esc(S.set.agrement)}" placeholder="N° agrément ONSSA"><input name="tva" type="number" min="0" max="100" step="0.01" value="${S.set.tva}" placeholder="TVA %"></div><button class="btn">Enregistrer</button></form></div><div class="card"><h3>Compte</h3><p style="color:var(--muted)">${esc(S.user.email)}<br>Abonnement valide jusqu’au ${S.lic.expires_on}</p><button class="btn sec" onclick="logout()">Se déconnecter</button></div>${installCard()}<div class="card"><h3>💾 Sauvegarde</h3><p style="color:var(--muted)">Téléchargez une copie de toutes vos données (produits, clients, factures, paiements…).</p><button class="btn sec" onclick="backupJson()">⬇️ Sauvegarder mes données</button></div>`}};
function loginView(){return`<div class="card" style="max-width:380px;margin:40px auto"><h2 style="text-align:center">🌾 PhytoStock Maroc</h2><p style="text-align:center;color:var(--muted)">Connectez-vous à votre compte</p><div class="row"><input id="em" type="email" placeholder="Email" autocomplete="email"></div><div class="row"><input id="pw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password"></div><div class="row"><button class="btn" onclick="auth('in')">Connexion</button></div><p style="text-align:center;color:var(--muted);font-size:13px">Pas encore de compte ? Contactez-nous : ${CONTACT}</p><div style="text-align:center"><button class="btn sm sec" onclick="setLang('${S.lang==='ar'?'fr':'ar'}')">🌐 ${S.lang==='ar'?'Français':'العربية'}</button></div></div>`}
function render(){document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.documentElement.lang=S.lang;$("nav").innerHTML='<div class="logo"><div class="lg">🌾</div><b>PhytoStock</b><small>Gestion de votre boîte phytosanitaire</small></div>'+PAGES.map(([id,ic,l])=>`<button class="${S.view===id?"on":""}" onclick="go('${id}')"><span>${ic}</span>${l}</button>`).join("")+`<div class="navf"><button onclick="setLang('${S.lang==="ar"?"fr":"ar"}')"><span>🌐</span>${S.lang==="ar"?"Français":"العربية"}</button><button onclick="logout()"><span>🚪</span>Déconnexion</button></div>`;$("co").textContent=S.user?S.set.nom:"";document.body.classList.toggle("out",!(S.user&&licOk()));$("main").innerHTML=S.user?(licOk()?licBanner()+V[S.view]():blockedView()):loginView();if(S.user&&S.view==="vente"&&$("sp"))fillPx();if(S.lang==="ar"){applyAr($("nav"));applyAr($("main"))}}
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
